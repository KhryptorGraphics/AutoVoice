# GPU and Server Configuration
server:
  host: 0.0.0.0
  port: 5000
  workers: 1
  debug: false

gpu:
  device: cuda:0
  compute_capability: "11.0"
  arch: sm_110
  max_memory_fraction: 0.9
  enable_cuda_kernels: true

audio:
  sample_rate: 22050
  hop_length: 512
  n_fft: 2048
  win_length: 2048
  n_mels: 80

models:
  # Host/bootstrap default. Containers mount AUTOVOICE_PRETRAINED_DIR to this
  # path so runtime config stays stable while operators choose the host dir.
  pretrained_dir: models/pretrained
  sovits_checkpoint: sovits5.0_main_1500.pth
  hifigan_checkpoint: hifigan_ljspeech.ckpt
  hubert_checkpoint: hubert-soft-0d54a1f4.pt

voice_conversion:
  singing_conversion_enabled: true
  voice_cloning_enabled: true

job_manager:
  enabled: true
  max_workers: 4
  ttl_seconds: 3600
  in_progress_ttl_seconds: 7200

# Vocal separation model for the conversion pipeline. 'htdemucs_ft' is the
# fine-tuned (cleaner, ~4x slower) variant used for fork-backed HQ conversions;
# 'htdemucs' is the faster default.
separation_model: htdemucs_ft

# Multi-speaker lead/backing split. 'karaoke_model' (Mel-Band RoFormer via the
# uvr bridge) promoted to operator default after listening review 2026-07-05;
# falls back to diarization spans automatically when the bridge is unavailable.
multi_speaker_separator: karaoke_model

# Taste knob for converted-harmony level: 1.0 = match the original backing
# stem's active loudness. Raised after "backing a little weak" review note.
multi_speaker_backing_gain: 1.2

# Voiced gate for converting individual backing-harmony lines. Comb extracts
# measure slightly below cluster audio (real lines straddled 0.65 at
# 0.60-0.66), so this sits a notch under the merge gate, inside the
# calibrated 0.51-0.76 margin.
multi_speaker_backing_voiced_min: 0.6

# Leak guard for the karaoke split: when its backing stem measures at least
# this voiced, treat the split as lead-retention and fall back to diarization
# spans. Solo covers with strongly-voiced self-doubles can trip it (measured
# 0.76 on a real case) — raise toward 0.85 to accept the split anyway.
multi_speaker_karaoke_leak_voiced_min: 0.65

# When the backing stem itself is near-monophonic (a doubled voice, not a
# polyphonic stack), convert it whole instead of per-line: whole-stem
# conversion leaves no original residual between notes (per-line comb swaps
# audibly speckle the source voice through doubles-heavy tracks).
multi_speaker_backing_whole_voiced_min: 0.7


# Embedding-based span reassignment for multi-speaker conversion
# Used when cluster-level spectral centroid gate cannot separate overlapping-register voices
# (e.g. light tenor vs Mezzo-Soprano sharing similar pitch ranges)
multi_speaker_embedding_reassign: true
  # If True, reassign primary spans whose wavlm embeddings are closer to the
  # preserved-speaker centroid than the primary centroid (by margin).
  # Set to False to disable and rely only on spectral centroid gating.
multi_speaker_embedding_margin: 0.9
  # Margin factor for embedding distance comparison.
  # A span is reassigned to backing if: dist_to_preserved < dist_to_primary * margin
  # Higher values (up to 1.0) are more aggressive about reassigning;
  # lower values (e.g. 0.7) are more conservative.
multi_speaker_embedding_window_s: 4.0
  # Window (seconds) the reassignment subdivides lead spans into. Diarizer
  # segments straddle singer handoffs (one 45s span held ~38s male + ~7s
  # female on the B&B duet), so whole-segment embeddings average the voices
  # and can't reclassify. 4s windows resolve the handoff (calibration used
  # 1s blocks); windows under 1.5s are not embedded at all.
